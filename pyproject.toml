[project]
name = "fordeling-af-140-genoptraeningsplaner"
version = "0.1.0"
description = "Fordeler §140 genoptræningsplaner i Odense kommune"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "datafordeler",
    "gadefortegnelsen",
    "httpx>=0.28.1",
    "kmd-nexus-client",
    "medcom-beskeder",
    "odk-tools",
    "openpyxl>=3.1",
    "python-dateutil>=2.9",
    "sue",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: calls real external APIs",
]

[tool.uv.sources]
gadefortegnelsen = { git = "https://github.com/odense-rpa/gadefortegnelsen.git" }
datafordeler = { git = "https://github.com/odense-rpa/datafordeler.git" }
medcom-beskeder = { git = "https://github.com/odense-rpa/medcom-beskeder.git" }
odk-tools = { git = "https://github.com/odense-rpa/odk-tools.git" }
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git" }
kmd-nexus-client = { git = "https://github.com/odense-rpa/nexus-client.git", rev = "c9f7d054db3fbdc42441dcf8fe8ff3247ab2f174" }
sue = { git = "https://github.com/odense-rpa/sue.git" }
